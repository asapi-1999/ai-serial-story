name: Tests

on:
  push:
    branches:
      - main
      - 'game-upload/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Tests
        run: python3 -m unittest discover -s tests
      - name: Run Static Checks
        run: node tests/check_static.js
      - name: Run Game Registration Tests
        run: node tests/test_register_game.js

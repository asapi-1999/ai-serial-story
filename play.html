<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
  >
  <title>ゲームを読み込み中… | ゲーム広場</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      color: #2c2c2c;
      background: #fdf9f3;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }
    .player-bar {
      min-width: 0;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 10px max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
      color: #315d46;
      background: rgba(253, 249, 243, .96);
      border-bottom: 1px solid #cdddcf;
      box-shadow: 0 2px 10px rgba(30, 65, 44, .08);
      z-index: 1;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 7px 13px;
      color: #315d46;
      background: #fff;
      border: 1px solid #b9cfbe;
      border-radius: 999px;
      text-decoration: none;
      font-size: .86rem;
      font-weight: bold;
      white-space: nowrap;
    }
    .back-link:hover { border-color: #5f9272; background: #f4faf5; }
    .back-link:focus-visible { outline: 3px solid rgba(95, 146, 114, .3); outline-offset: 2px; }
    .game-title {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: #315d46;
      font-size: 1rem;
      line-height: 1.4;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .plaza-label {
      color: #799585;
      font-size: .76rem;
      white-space: nowrap;
    }
    .game-frame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      background: #fff;
    }
    .error {
      align-self: start;
      justify-self: center;
      max-width: 560px;
      margin: 48px 20px;
      padding: 24px;
      color: #684a4a;
      background: #fff;
      border: 1px solid #e5c9c9;
      border-radius: 14px;
      line-height: 1.7;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .06);
    }
    @media (max-width: 560px) {
      .player-bar { display: flex; }
      .plaza-label { display: none; }
      .back-link { min-height: 36px; padding: 6px 10px; font-size: .78rem; }
      .game-title { display: none; }
    }
  </style>
</head>
<body>
  <header class="player-bar">
    <a class="back-link" href="games.html" aria-label="ゲームを終了してゲーム広場へ戻る">
      ← ゲーム広場へ戻る
    </a>
    <h1 id="gameTitle" class="game-title">ゲームを読み込み中…</h1>
    <span class="plaza-label">🎮 ゲーム広場</span>
  </header>
  <iframe
    id="gameFrame"
    class="game-frame"
    title="ゲーム"
    allow="fullscreen"
    allowfullscreen
  ></iframe>
  <div id="error" class="error" hidden>
    ゲームを開けませんでした。ゲーム広場へ戻って、もう一度選択してください。
  </div>

  <script>
    'use strict';

    var gameTitle = document.getElementById('gameTitle');
    var gameFrame = document.getElementById('gameFrame');
    var errorBox = document.getElementById('error');
    var gameId = new URLSearchParams(window.location.search).get('id') || '';

    function showError() {
      gameTitle.textContent = 'ゲームを開けませんでした';
      document.title = 'ゲームを開けませんでした | ゲーム広場';
      gameFrame.hidden = true;
      errorBox.hidden = false;
    }

    if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(gameId)) {
      showError();
    } else {
      fetch('games.json', { cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) throw new Error('games.json: HTTP ' + response.status);
          return response.json();
        })
        .then(function (games) {
          if (!Array.isArray(games)) throw new Error('games.json is not an array');
          var game = games.find(function (item) { return item.id === gameId; });
          if (!game || game.path !== 'games/' + gameId + '/') {
            throw new Error('game not found');
          }
          gameTitle.textContent = game.title;
          document.title = game.title + ' | ゲーム広場';
          gameFrame.title = game.title;
          gameFrame.src = game.path;
        })
        .catch(showError);
    }
  </script>
</body>
</html>
